apiVersion: apps/v1
kind: Deployment
metadata:
  name: nagarik-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nagarik-api
  template:
    metadata:
      labels:
        app: nagarik-api
    spec:
      containers:
        - name: api
          image: nagarik-chain-backend:0.1.0
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: nagarik-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nagarik-api
spec:
  selector:
    app: nagarik-api
  ports:
    - port: 80
      targetPort: 8000
