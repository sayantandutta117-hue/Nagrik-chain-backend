[project]
name = "nagarik-chain-backend"
version = "0.1.0"
description = "Backend and AI implementation for Nagarik Chain"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "cryptography>=42.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "joblib>=1.4",
  "opencv-python-headless>=4.10",
  "pillow>=10.3",
  "web3>=6.20",
  "grpcio>=1.64",
  "fabric-gateway>=1.0",
  "fabric-sdk-py>=1.0"
]

[project.optional-dependencies]
ai = [
  "celery>=5.4",
  "langdetect>=1.0.9",
  "pytesseract>=0.3.13",
  "paddleocr>=2.8",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "torch>=2.3",
  "tensorflow>=2.16",
  "transformers>=4.42",
  "langchain>=0.2",
  "langchain-openai>=0.1",
  "deepface>=0.0.92",
  "shap>=0.46"
]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
  "mypy>=1.10"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
